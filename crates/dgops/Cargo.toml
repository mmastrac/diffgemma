[package]
name = "dgops"
version = "0.1.0"
edition = "2024"
description = "Portable GPU ops (Metal + CUDA) with CPU oracles, shared by the engine and examples"
license = "MIT"

[features]
default = []
# Build the CUDA kernel bodies with nvcc and enable the CUDA dispatch path.
# The driver is resolved at runtime, so the Rust side builds without a toolkit.
cuda = ["gpukit/cuda"]

[dependencies]
gpukit = { path = "../gpukit", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLAllocation",
    "MTLTypes",
] }
