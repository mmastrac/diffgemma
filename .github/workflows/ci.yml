name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# This is an Apple-Silicon Metal inference engine. The default (non-metal) build
# does not compile (the CPU-only path is unmaintained), so CI runs on macOS with
# the `metal` feature. GitHub-hosted `macos-14` runners are Apple Silicon and
# expose Metal, so the fixture-based kernel/GPU tests run there. Tests that need
# the quantized model (smoketest gate, needle) skip gracefully — they belong on a
# self-hosted runner with the weights (see the nightly scaffold at the bottom).

jobs:
  fmt:
    # `cargo fmt --check` only parses/formats — no compile, no Metal — so it runs
    # cheaply on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  build-test:
    # The real gate: build + the full fixture-based unit/oracle suite on Metal.
    # MUST be single-threaded — parallel GPU tests SIGSEGV (concurrent Metal
    # command buffers on the shared device). Model-gated tests skip (no weights).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --features metal,blas
      - name: Test (single-threaded — parallel GPU tests crash)
        run: cargo test --release --features metal,blas -- --test-threads=1

  clippy:
    # Non-blocking: ~400 pre-existing warnings. Surfaces new lints in the log
    # without gating; flip to `-D warnings` after a cleanup pass. Needs Metal to
    # compile (non-metal build is broken), so it runs on macOS.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --release --features metal,blas

