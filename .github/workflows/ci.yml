name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# This is an Apple-Silicon Metal inference engine. Metal is the only backend
# (there is no CPU forward path), so the GPU code compiles unconditionally on
# macOS and the crate is macOS-only (non-macOS targets hit a compile_error). CI
# therefore runs the build/test/clippy jobs on GitHub-hosted `macos-14` runners
# (Apple Silicon, Metal-capable) with no feature flags. Tests that need the
# quantized model (smoketest gate, needle) skip gracefully — they belong on a
# self-hosted runner with the weights (see the nightly scaffold at the bottom).

jobs:
  fmt:
    # `cargo fmt --check` only parses/formats — no compile, no Metal — so it runs
    # cheaply on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  build-test:
    # The real gate: build + the full fixture-based unit/oracle suite on Metal.
    # MUST be single-threaded — parallel GPU tests SIGSEGV (concurrent Metal
    # command buffers on the shared device). Model-gated tests skip (no weights).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Test (single-threaded — parallel GPU tests crash)
        run: cargo test --release -- --test-threads=1

  clippy:
    # Non-blocking: ~400 pre-existing warnings. Surfaces new lints in the log
    # without gating; flip to `-D warnings` after a cleanup pass. Runs on macOS
    # (the crate is macOS-only — Metal is unconditional).
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --release

# ---------------------------------------------------------------------------
