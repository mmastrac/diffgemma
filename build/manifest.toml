# Kernel function-constant manifest.
#
# FC 1–3 are reserved globally (see shaders/kernels/common.metal).
# Shared device math lives in shaders/include/ (dequant, activations, common).
# FC 4+ are per-kernel; each kernel lists its full index map under [kernel.fc].
# Pipeline construction in Rust MUST only build tuples listed under [[kernel.variants]].
# Tier-1 tests MUST cover every [[kernel.variants]] row (see manifest.rs tests).

[[kernel]]
name = "rms_norm_rows"
entry = "rms_norm_rows"
quant_formats = [0]  # inert; only q4_affine

[kernel.fc]
1 = "K_SHAPE_ASSERT"
2 = "K_DUMP_STAGE"
3 = "K_QUANT_FORMAT"
4 = "K_AFFINE"

[[kernel.variants]]
affine = false

[[kernel.variants]]
affine = true

[[kernel]]
name = "rms_norm_rows_tiled"
entry = "rms_norm_rows_tiled"
quant_formats = [0]

[kernel.fc]
1 = "K_SHAPE_ASSERT"
2 = "K_DUMP_STAGE"
3 = "K_QUANT_FORMAT"
4 = "K_IN_DTYPE"

[[kernel.variants]]
in_dtype = 0  # f32 in, half out

[[kernel.variants]]
in_dtype = 1  # half in, half out

