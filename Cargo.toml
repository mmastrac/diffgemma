[package]
name = "diffgemma-mps"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "diffgemma-mps"
path = "src/main.rs"

# This is an Apple-Silicon Metal inference engine. Metal is not an optional
# backend — it is the only backend, and there is no CPU forward path. The GPU
# code is compiled unconditionally on macOS (see `#[cfg(target_os = "macos")]`
# throughout `src/`); non-macOS targets fail fast with a compile_error in
# `src/main.rs`. The objc2/* deps below live under the macOS target table, so
# they are only pulled when building for macOS.
[features]
default = ["blas"]
blas = []

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zero-dependency model fetch: wraps whatever download tool the host has
# (curl/wget/etc.) behind a Rust API. Used by the `download` subcommand.
shell-download = "0.22"
# Integrity pin for external HF-safetensors refs in layered packs (hash of the
# safetensors header only, not the multi-GiB payload — see dgq/hf_resolve.rs).
sha2 = "0.10"

# Host-side test code runs real inference (smokes, KV fingerprints over
# hundreds of MB); at opt-level 0 the per-byte loops dominate suite wall.
# opt-level 1 changes no outputs (no fast-math) — debug_assertions stay on.
[profile.test]
opt-level = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
# Raw mmap/MAP_FIXED for the VA-splice diagnostic probe (test-only usage).
libc = "0.2"
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLBinaryArchive",
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLAllocation",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLTypes",
    "MTLFunctionConstantValues",
    "MTLDataType",
    "block2",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSURL",
    "NSArray",
] }
rustyline = "18.0.1"
