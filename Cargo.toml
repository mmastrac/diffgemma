[package]
name = "diffgemma-mps"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "diffgemma-mps"
path = "src/main.rs"

[features]
default = ["blas"]
blas = []
metal = ["dep:objc2", "dep:objc2-metal", "dep:objc2-foundation", "dep:objc2-metal-performance-shaders", "dep:block2"]

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true, default-features = false, features = ["std"] }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLBinaryArchive",
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLAllocation",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLTypes",
    "MTLFunctionConstantValues",
    "MTLDataType",
    "block2",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSURL",
    "NSArray",
] }
objc2-metal-performance-shaders = { version = "0.3", optional = true, default-features = false, features = [
    "MPSCore",
    "MPSCoreTypes",
    "MPSKernel",
    "MPSMatrix",
    "MPSMatrixMultiplication",
] }
